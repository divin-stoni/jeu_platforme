<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Flacon Johnson's Baby Oil</title>
  <defs>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd8de"/>
      <stop offset="0.25" stop-color="#f4f8fa"/>
      <stop offset="0.7" stop-color="#e6edf1"/>
      <stop offset="1" stop-color="#bcc8d0"/>
    </linearGradient>
    <linearGradient id="huile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f6f8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d4dfe5" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bouchon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9a9bd"/>
      <stop offset="0.35" stop-color="#f8cfdb"/>
      <stop offset="1" stop-color="#e3a0b5"/>
    </linearGradient>
    <linearGradient id="etiquette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b8cb"/>
      <stop offset="1" stop-color="#f2a9c0"/>
    </linearGradient>
    <radialGradient id="ombre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="forme">
      <path d="M168 92 L232 92 C232 120 236 135 250 160 C285 200 312 240 314 300 L314 500 C314 532 296 552 265 554 L135 554 C104 552 86 532 86 500 L86 300 C88 240 115 200 150 160 C164 135 168 120 168 92 Z"/>
    </clipPath>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="200" cy="560" rx="135" ry="18" fill="url(#ombre)"/>

  <!-- Corps du flacon -->
  <path d="M168 92 L232 92 C232 120 236 135 250 160 C285 200 312 240 314 300 L314 500 C314 532 296 552 265 554 L135 554 C104 552 86 532 86 500 L86 300 C88 240 115 200 150 160 C164 135 168 120 168 92 Z"
        fill="url(#verre)" stroke="#aebcc5" stroke-width="2"/>

  <!-- Huile -->
  <g clip-path="url(#forme)">
    <rect x="80" y="150" width="240" height="410" fill="url(#huile)"/>
    <ellipse cx="200" cy="150" rx="52" ry="7" fill="#ffffff" opacity="0.7"/>
    <!-- Épaisseur du fond -->
    <path d="M86 520 C100 548 140 556 200 556 C260 556 300 548 314 520 L314 560 L86 560 Z" fill="#b9c7cf" opacity="0.6"/>
  </g>

  <!-- Reflets -->
  <path d="M108 300 C106 380 106 450 110 500" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M296 290 C298 380 298 450 294 505" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M186 175 C160 200 134 225 124 262" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Col -->
  <rect x="170" y="84" width="60" height="14" rx="3" fill="#dfe8ed" stroke="#aebcc5" stroke-width="1.5"/>

  <!-- Bouchon -->
  <rect x="158" y="38" width="84" height="52" rx="9" fill="url(#bouchon)" stroke="#d98aa4" stroke-width="2"/>
  <g stroke="#d98aa4" stroke-width="1.5" opacity="0.7">
    <line x1="172" y1="44" x2="172" y2="84"/>
    <line x1="184" y1="44" x2="184" y2="84"/>
    <line x1="196" y1="44" x2="196" y2="84"/>
    <line x1="208" y1="44" x2="208" y2="84"/>
    <line x1="220" y1="44" x2="220" y2="84"/>
    <line x1="232" y1="44" x2="232" y2="84"/>
  </g>
  <rect x="164" y="42" width="14" height="44" rx="6" fill="#ffffff" opacity="0.35"/>

  <!-- Étiquette rose en goutte -->
  <path d="M200 232 C236 272 272 305 272 355 C272 405 242 432 200 432 C158 432 128 405 128 355 C128 305 164 272 200 232 Z"
        fill="url(#etiquette)" stroke="#e58aa9" stroke-width="1.5"/>

  <!-- Badge "mildness" -->
  <circle cx="200" cy="288" r="14" fill="#ffffff" stroke="#e58aa9" stroke-width="1"/>
  <text x="200" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#d9577f">mildness</text>

  <!-- Cœurs -->
  <path d="M236 268 C236 262 244 262 244 268 C244 262 252 262 252 268 C252 274 244 280 244 282 C244 280 236 274 236 268 Z" fill="#e8567f"/>
  <path d="M246 281 C246 277 251 277 251 281 C251 277 256 277 256 281 C256 285 251 288 251 289 C251 288 246 285 246 281 Z" fill="#f08aa8"/>

  <!-- Marque -->
  <text x="200" y="352" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', 'Georgia', serif" font-style="italic" font-weight="bold" font-size="31" fill="#1d5fb0">Johnson's</text>
  <text x="200" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1d5fb0">baby</text>
  <text x="200" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1d5fb0">oil</text>
  <text x="200" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="6.5" fill="#1d5fb0">aceite para bebés</text>

  <!-- Encadré rouge -->
  <rect x="160" y="401" width="80" height="14" rx="2" fill="none" stroke="#d6334f" stroke-width="1"/>
  <text x="200" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="4.6" fill="#d6334f">locks in up to 10X more moisture*</text>
  <text x="200" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3.8" fill="#d6334f">no parabens, phthalates or dyes</text>

  <!-- Marque Johnson & Johnson (stylisée) -->
  <text x="200" y="426" text-anchor="middle" font-family="'Brush Script MT', 'Georgia', serif" font-style="italic" font-size="6" fill="#1d5fb0">Johnson&amp;Johnson</text>

  <!-- Mention volume -->
  <text x="200" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#6f7f89">20 FL OZ (591 mL)</text>
</svg>
